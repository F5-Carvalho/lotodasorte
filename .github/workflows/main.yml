name: Build APK LotoDaSorte

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependências do sistema Android / Buildozer
      run: |
        sudo apt-get update
        
        # 1. Corrige problemas de pacotes retidos na imagem nativa do GitHub
        sudo apt-get install -f -y
        
        # 2. Instala a dependência que estava quebrando o GStreamer isoladamente
        sudo apt-get install -y libunwind-dev
        
        # 3. Instala o restante dos pacotes necessários para o Buildozer
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          libssl-dev \
          openssl \
          libgdbm-dev \
          libgdbm-compat-dev \
          liblzma-dev \
          libreadline-dev \
          libncursesw5-dev \
          libffi-dev \
          uuid-dev \
          libgconf-2-4 \
          libxdg-basedir1 \
          unzip \
          zip

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Cache do Buildozer e SDK/NDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Aceitar Licenças do Android SDK automaticamente
      run: |
        # Cria a pasta de licenças do Android antes que o Buildozer comece a baixar as ferramentas
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        
        # Injeta os hashes de aprovação oficiais das licenças SDK do Android
        echo -e "\n8933bad161af4178b1185d1a37fdd41ea5fb44d5\n739a052649f257d64718415214acb7ebea6fdb13\n601085b94cd77f6b54b78cf0de2396e3861186ec\nc33c2f33b3de51911efded4c72193dd504621676\n24333f1a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Gerar APK com Buildozer
      run: buildozer -v android debug

    - name: Upload da APK gerada como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: LotoDaSorte-APK
        path: bin/*.apk
