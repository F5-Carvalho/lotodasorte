[app]

# Nome do app (aparece no celular)
title = LotoDaSorte

# Nome do pacote (só letras minúsculas, sem espaço)
package.name = lotodasorte

# Domínio do pacote
package.domain = app.lotodasorte

# Pasta com o código fonte
source.dir = .

# Extensões de arquivo a incluir
source.include_exts = py,png,jpg,jpeg,gif,atlas,json,kv

# Versão do app
version = 1.0

# Dependências Python
requirements = python3,kivy==2.3.0,pillow

# Orientação da tela
orientation = portrait

# Ícone (deixe comentado se não tiver)
# icon.filename = %(source.dir)s/icon.png

# Presplash (deixe comentado se não tiver)
# presplash.filename = %(source.dir)s/presplash.png

# Cor do presplash (enquanto carrega)
android.presplash_color = #0D0019

# Permissões necessárias
android.permissions = WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE

# Versão mínima do Android (Android 5.0+)
android.minapi = 21

# SDK alvo
android.ndk = 25b
android.sdk = 34
android.build_tools_version = 34.0.0

# Arquiteturas suportadas (arm64-v8a = celulares modernos, armeabi-v7a = mais antigos)
android.archs = arm64-v8a, armeabi-v7a

# Aceitar automaticamente licenças do SDK
android.accept_sdk_license = True

# Habilitar backup
android.allow_backup = True

[buildozer]

# Nível de log: 0 = erro, 1 = info, 2 = debug
log_level = 2

# Aviso se buildozer estiver desatualizado
warn_on_root = 1
